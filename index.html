<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزن النغمات الموسيقية | Music Tuner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            touch-action: manipulation;
        }

        .gauge-container {
            position: relative;
            width: 320px;
            height: 170px;
            margin: 0 auto;
            overflow: hidden;
        }

        .gauge-bg {
            width: 300px;
            height: 150px;
            border-top-left-radius: 150px;
            border-top-right-radius: 150px;
            background: conic-gradient(
                from 270deg at 50% 100%,
                #ef4444 0deg 45deg,
                #f59e0b 45deg 75deg,
                #10b981 75deg 105deg,
                #f59e0b 105deg 135deg,
                #ef4444 135deg 180deg
            );
            margin: 10px auto 0;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .gauge-inner {
            width: 250px;
            height: 125px;
            border-top-left-radius: 125px;
            border-top-right-radius: 125px;
            background-color: #161b22;
            position: absolute;
            bottom: 0;
            left: 25px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .needle {
            width: 4px;
            height: 120px;
            background: linear-gradient(to top, #38bdf8, #f43f5e);
            position: absolute;
            bottom: 0;
            left: calc(50% - 2px);
            transform-origin: bottom center;
            transform: rotate(0deg);
            transition: transform 0.12s ease-out;
            border-radius: 2px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .needle-pivot {
            width: 18px;
            height: 18px;
            background-color: #f8fafc;
            border-radius: 50%;
            position: absolute;
            bottom: -9px;
            left: calc(50% - 9px);
            z-index: 11;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        .locked-glow {
            animation: pulse-green 1.5s infinite alternate;
            border-color: #10b981 !important;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4) !important;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
            100% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.7); }
        }

        .glass-panel {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
                <i class="fa-solid fa-guitar text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">موزن النغمات</h1>
                <p class="text-xs text-gray-400">ضبط الصوت والآلات الموسيقية</p>
            </div>
        </div>
        <button id="toneGenToggle" class="px-3 py-1.5 rounded-lg text-xs font-semibold glass-panel text-gray-300 hover:text-white transition border border-gray-700">
            <i class="fa-solid fa-wave-square me-1 text-indigo-400"></i> مولد نغمات
        </button>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center gap-5">

        <!-- Tuner Display Card -->
        <div id="mainCard" class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center shadow-2xl transition-all duration-300 border border-gray-800">
            
            <!-- Target Presets Selector -->
            <div class="w-full flex justify-between items-center mb-6 bg-gray-900/60 p-1.5 rounded-xl border border-gray-800/80">
                <select id="tuningPreset" class="bg-transparent text-xs text-gray-300 font-medium px-2 py-1 focus:outline-none w-full cursor-pointer">
                    <option value="chromatic" class="bg-gray-900 text-white">موزن عام (Chromatic)</option>
                    <option value="oud" class="bg-gray-900 text-white">دوزان العود العربي (C, F, A, D, G, C)</option>
                    <option value="guitar" class="bg-gray-900 text-white">جيتار قياسي (E, A, D, G, B, E)</option>
                    <option value="violin" class="bg-gray-900 text-white">كمان قياسي (G, D, A, E)</option>
                    <option value="voice" class="bg-gray-900 text-white">ضبط الصوت البشري (Voice Pitch)</option>
                </select>
            </div>

            <!-- Gauge Meter -->
            <div class="gauge-container mb-2">
                <div class="gauge-bg">
                    <div class="gauge-inner">
                        <div id="needle" class="needle"></div>
                        <div class="needle-pivot"></div>
                    </div>
                </div>
            </div>

            <!-- Cents Indicator -->
            <div class="flex justify-between w-48 text-xs font-bold text-gray-500 mb-2">
                <span>-50</span>
                <span id="centsValue" class="text-sm font-extrabold text-gray-300">0 Cents</span>
                <span>+50</span>
            </div>

            <!-- Current Note Large Display -->
            <div class="text-center my-2">
                <div id="noteDisplay" class="text-6xl font-black tracking-wider text-gray-600 transition-colors duration-200">--</div>
                <div id="noteArabicDisplay" class="text-lg font-bold text-gray-400 mt-1">اضغط تشغيل للبدء</div>
            </div>

            <!-- Frequency Display -->
            <div class="mt-2 text-sm font-mono text-gray-400 bg-gray-900/80 px-4 py-1.5 rounded-full border border-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-microchip text-xs text-indigo-400"></i>
                <span id="freqDisplay">0.0 Hz</span>
            </div>

            <!-- Status Indicator -->
            <div id="statusBadge" class="mt-4 px-4 py-1.5 rounded-full text-xs font-bold bg-gray-800 text-gray-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                <span>بانتظار الإشارة الصوتية...</span>
            </div>

        </div>

        <!-- Tone Generator Panel (Hidden by Default) -->
        <div id="toneGenPanel" class="w-full glass-panel rounded-2xl p-4 hidden flex-col items-center gap-3 border border-indigo-500/20">
            <div class="flex justify-between w-full items-center">
                <span class="text-xs font-bold text-gray-300"><i class="fa-solid fa-volume-high text-indigo-400 me-1"></i> مولد النغمة المرجعية</span>
                <span id="toneFreqLabel" class="text-xs font-mono text-indigo-400 font-bold">440 Hz</span>
            </div>
            <div class="flex items-center gap-2 w-full">
                <button id="playToneBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-play" id="playToneIcon"></i> تشغيل
                </button>
                <input type="range" id="toneFreqSlider" min="100" max="880" value="440" class="w-full accent-indigo-500 cursor-pointer">
            </div>
        </div>

        <!-- Reference Pitch Setting -->
        <div class="w-full flex justify-between items-center px-4 py-2 rounded-2xl glass-panel text-xs text-gray-400 border border-gray-800">
            <span>التردد المرجعي (A4):</span>
            <div class="flex items-center gap-2">
                <button id="ref432" class="px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300">432Hz</button>
                <button id="ref440" class="px-2 py-1 rounded bg-indigo-600 text-white font-bold">440Hz</button>
            </div>
        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md mt-4">
        <button id="startBtn" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-lg shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-3 active:scale-95">
            <i class="fa-solid fa-microphone text-xl"></i>
            <span id="startBtnText">بدء الموزن</span>
        </button>
    </footer>

    <!-- Audio Pitch Detection & Smoothing Logic -->
    <script>
        const noteStringsAr = ["دو", "دو# / ريه♭", "ريه", "ريه# / مي♭", "مي", "فا", "فا# / صول♭", "صول", "صول# / لا♭", "لا", "لا# / سي♭", "سي"];
        const noteStringsEn = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let isListening = false;
        let refA4 = 440;
        
        // Smoothing parameters
        let smoothedCents = 0;
        let smoothedFreq = 0;
        let lockCounter = 0;

        // Tone Generator State
        let toneOsc = null;
        let toneGain = null;
        let isTonePlaying = false;

        // DOM Elements
        const startBtn = document.getElementById('startBtn');
        const startBtnText = document.getElementById('startBtnText');
        const needle = document.getElementById('needle');
        const noteDisplay = document.getElementById('noteDisplay');
        const noteArabicDisplay = document.getElementById('noteArabicDisplay');
        const freqDisplay = document.getElementById('freqDisplay');
        const centsValue = document.getElementById('centsValue');
        const statusBadge = document.getElementById('statusBadge');
        const mainCard = document.getElementById('mainCard');

        // Reference Pitch
        document.getElementById('ref432').addEventListener('click', (e) => {
            refA4 = 432;
            e.target.className = "px-2 py-1 rounded bg-indigo-600 text-white font-bold";
            document.getElementById('ref440').className = "px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300";
        });
        document.getElementById('ref440').addEventListener('click', (e) => {
            refA4 = 440;
            e.target.className = "px-2 py-1 rounded bg-indigo-600 text-white font-bold";
            document.getElementById('ref432').className = "px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300";
        });

        // Toggle Microphone
        startBtn.addEventListener('click', async () => {
            if (!isListening) {
                await startAudio();
            } else {
                stopAudio();
            }
        });

        async function startAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096;
                microphone.connect(analyser);

                isListening = true;
                startBtnText.textContent = "إيقاف الموزن";
                startBtn.className = "w-full py-4 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-lg shadow-lg shadow-rose-600/30 transition-all flex items-center justify-center gap-3 active:scale-95";
                
                updatePitch();
            } catch (err) {
                alert("لم نتمكن من الوصول للميكروفون. يرجى سماح الإذن بالمتصفح.");
            }
        }

        function stopAudio() {
            if (audioCtx) {
                audioCtx.close();
            }
            isListening = false;
            startBtnText.textContent = "بدء الموزن";
            startBtn.className = "w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-lg shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-3 active:scale-95";
            resetUI();
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);

            // Noise Gate Threshold
            if (rms < 0.015) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
            }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;

            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function updatePitch() {
            if (!isListening) return;

            let buf = new Float32Array(4096);
            analyser.getFloatTimeDomainData(buf);
            let pitch = autoCorrelate(buf, audioCtx.sampleRate);

            if (pitch === -1) {
                // Low signal / Silence
                lockCounter = 0;
                mainCard.classList.remove('locked-glow');
                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-500"></span><span>استماع للأصوات...</span>`;
            } else {
                // Exponential Smoothing (Heavy Low-pass Filter for smoothness)
                smoothedFreq = smoothedFreq === 0 ? pitch : (smoothedFreq * 0.82 + pitch * 0.18);

                let noteNum = 12 * (Math.log(smoothedFreq / refA4) / Math.log(2));
                let pitchIndex = Math.round(noteNum) + 69;
                let cents = Math.floor((noteNum - Math.round(noteNum)) * 100);

                // Smooth Cents Needle Movement
                smoothedCents = smoothedCents * 0.75 + cents * 0.25;

                let noteNameEn = noteStringsEn[pitchIndex % 12];
                let noteNameAr = noteStringsAr[pitchIndex % 12];
                let octave = Math.floor(pitchIndex / 12) - 1;

                // Update Needle UI
                let angle = Math.max(-80, Math.min(80, (smoothedCents / 50) * 80));
                needle.style.transform = `rotate(${angle}deg)`;

                // Update Text Displays
                noteDisplay.textContent = `${noteNameEn}${octave}`;
                noteArabicDisplay.textContent = `${noteNameAr} (Octave ${octave})`;
                freqDisplay.textContent = `${smoothedFreq.toFixed(1)} Hz`;
                centsValue.textContent = `${smoothedCents > 0 ? '+' : ''}${Math.round(smoothedCents)} Cents`;

                // Color Logic & Perfect Tune Lock
                if (Math.abs(smoothedCents) <= 5) {
                    lockCounter++;
                    noteDisplay.className = "text-6xl font-black tracking-wider text-emerald-400 transition-colors duration-200";
                    centsValue.className = "text-sm font-extrabold text-emerald-400";
                    statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span><span class="text-emerald-400 font-extrabold">النغمة مضبوطة تماماً! ✓</span>`;
                    
                    if (lockCounter > 5) {
                        mainCard.classList.add('locked-glow');
                    }
                } else if (smoothedCents < -5) {
                    lockCounter = 0;
                    mainCard.classList.remove('locked-glow');
                    noteDisplay.className = "text-6xl font-black tracking-wider text-amber-400 transition-colors duration-200";
                    centsValue.className = "text-sm font-extrabold text-amber-400";
                    statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="text-amber-400">النغمة هابطة (Flat ♭) - شد الوتر قليلاً</span>`;
                } else {
                    lockCounter = 0;
                    mainCard.classList.remove('locked-glow');
                    noteDisplay.className = "text-6xl font-black tracking-wider text-rose-500 transition-colors duration-200";
                    centsValue.className = "text-sm font-extrabold text-rose-500";
                    statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span class="text-rose-400">النغمة حادة (Sharp ♯) - أرخِ الوتر قليلاً</span>`;
                }
            }

            requestAnimationFrame(updatePitch);
        }

        function resetUI() {
            needle.style.transform = `rotate(0deg)`;
            noteDisplay.textContent = "--";
            noteDisplay.className = "text-6xl font-black tracking-wider text-gray-600 transition-colors duration-200";
            noteArabicDisplay.textContent = "اضغط تشغيل للبدء";
            freqDisplay.textContent = "0.0 Hz";
            centsValue.textContent = "0 Cents";
            centsValue.className = "text-sm font-extrabold text-gray-300";
            mainCard.classList.remove('locked-glow');
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-500"></span><span>الموزن متوقف</span>`;
            smoothedFreq = 0;
            smoothedCents = 0;
        }

        // Tone Generator Logic
        const toneGenToggle = document.getElementById('toneGenToggle');
        const toneGenPanel = document.getElementById('toneGenPanel');
        const playToneBtn = document.getElementById('playToneBtn');
        const playToneIcon = document.getElementById('playToneIcon');
        const toneFreqSlider = document.getElementById('toneFreqSlider');
        const toneFreqLabel = document.getElementById('toneFreqLabel');

        toneGenToggle.addEventListener('click', () => {
            toneGenPanel.classList.toggle('hidden');
            toneGenPanel.classList.toggle('flex');
        });

        toneFreqSlider.addEventListener('input', (e) => {
            toneFreqLabel.textContent = `${e.target.value} Hz`;
            if (toneOsc) {
                toneOsc.frequency.setValueAtTime(e.target.value, audioCtx.currentTime);
            }
        });

        playToneBtn.addEventListener('click', () => {
            if (!isTonePlaying) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                toneOsc = audioCtx.createOscillator();
                toneGain = audioCtx.createGain();
                toneOsc.type = 'sine';
                toneOsc.frequency.value = toneFreqSlider.value;
                toneGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                toneOsc.connect(toneGain);
                toneGain.connect(audioCtx.destination);
                toneOsc.start();
                isTonePlaying = true;
                playToneIcon.className = "fa-solid fa-square";
                playToneBtn.classList.replace('bg-indigo-600', 'bg-rose-600');
            } else {
                if (toneOsc) {
                    toneOsc.stop();
                    toneOsc.disconnect();
                }
                isTonePlaying = false;
                playToneIcon.className = "fa-solid fa-play";
                playToneBtn.classList.replace('bg-rose-600', 'bg-indigo-600');
            }
        });
    </script>
</body>
</html>
